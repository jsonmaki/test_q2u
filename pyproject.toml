[project]
name = "test_q2u"
version = "2.6.1"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx[http2]",
    "psutil",
]
authors = [
    {name = "jsoneri", email = "jsoneri@outlook.com"},
]
keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
script = [
    "redis",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "assets/",
    "ComicSpider/",
    "deploy/",c
    "GUI/",
    "utils/",
    "variables/",
    "custom/",
    "docs/public/*.png",
    "CGS.py",
    "crawl_only.py",
    "scrapy.cfg"
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/jsonmaki/test_q2u"
Releases = "https://github.com/jsonmaki/test_q2u/releases"

[project.scripts]
cgs-cli = "crawl_only:main"

[project.gui-scripts]
cgs = "CGS:start"
comicguispider = "CGS:start"
